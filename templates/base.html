{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Мероприятия, организации и участники донорских акций.">
  <title>{% block title %}Донорские мероприятия{% endblock %}</title>
  <link rel="icon" href="{% static 'homepage/img/logo.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
  <script src="{% static 'homepage/js/main.js' %}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Перейти к содержимому</a>
  {% include "includes/navigation.html" %}
  <main id="main-content" class="container site-main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="current-year">{% now "Y" %}</span> Донорские мероприятия</p>
      <p>Каждая донация имеет значение.</p>
    </div>
  </footer>
</body>
</html>
